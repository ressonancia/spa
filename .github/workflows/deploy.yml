name: Deploy Ressonance SPA

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: dist
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
      SSH_KEY_NAME: id_rsa_ressonance
      WG_INTERFACE: wg0

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build the Vue.js application
      - name: Build Application
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
        run: |
          echo "Building Vue.js application..."
          printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env.production
          npm run build

          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Build directory '$BUILD_DIR' does not exist. Build failed."
            exit 1
          fi
          echo "Build completed successfully."

      # Step 5: Connect to the private network through WireGuard
      - name: Set up WireGuard
        env:
          WIREGUARD_CONF: ${{ secrets.WIREGUARD_CONF }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools

          sudo install -d -m 700 /etc/wireguard
          printf '%s\n' "$WIREGUARD_CONF" | tr -d '\r' | sudo tee /etc/wireguard/$WG_INTERFACE.conf > /dev/null
          sudo chmod 600 /etc/wireguard/$WG_INTERFACE.conf

          sudo wg-quick up $WG_INTERFACE
          sudo wg show $WG_INTERFACE

      # Step 6: Copy the build files to the remote server
      - name: Deploy to Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/$SSH_KEY_NAME
          chmod 600 ~/.ssh/$SSH_KEY_NAME

          echo "Deploying files to $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH..."
          scp -i ~/.ssh/$SSH_KEY_NAME \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -r $BUILD_DIR/* "$REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH"
          echo "Deployment completed successfully!"

      - name: Clean Up
        if: always()
        run: |
          sudo wg-quick down $WG_INTERFACE 2>/dev/null || true
          sudo rm -f /etc/wireguard/$WG_INTERFACE.conf
          rm -f ~/.ssh/$SSH_KEY_NAME .env.production
