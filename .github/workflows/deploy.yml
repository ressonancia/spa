name: Deploy Ressonance SPA

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: dist
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
      SSH_KEY_NAME: id_rsa_ressonance

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build the Vue.js application
      - name: Build Application
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          echo "Building Vue.js application..."
          printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env.production
          npm run build

          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Build directory '$BUILD_DIR' does not exist. Build failed."
            exit 1
          fi
          echo "Build completed successfully."

      # Step 5: Copy the build files to the remote server
      - name: Deploy to Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/$SSH_KEY_NAME
          chmod 600 ~/.ssh/$SSH_KEY_NAME

          echo "Deploying files to $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH..."
          scp -i ~/.ssh/$SSH_KEY_NAME \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -r $BUILD_DIR/* "$REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH"
          echo "Deployment completed successfully!"

      - name: Clean Up
        if: always()
        run: rm -f ~/.ssh/$SSH_KEY_NAME .env.production
